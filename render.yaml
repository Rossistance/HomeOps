services:
  - type: web
    name: homeops-ai
    runtime: node
    region: oregon
    # Persistent disks are not available on Render's Free web-service plan.
    plan: starter
    # --include=dev is required: NODE_ENV=production (set below) also applies at
    # build time on Render, and a bare `npm ci` would omit the devDependencies
    # that the build itself needs (vite, tsc, tailwind).
    # T4 — "how am I intended to run browser automation with Playwright or something similar
    # from the server? Is that stored and ran from the server? We need to make this be able to
    # work." From the server, yes — and the reason it said "runtime offline" is right here: the
    # playwright PACKAGE was installed, but its Chromium BINARY never was. server/browser.mjs
    # would try to launch, fail, and mark itself unavailable for the life of the process, so the
    # connector honestly reported a runtime that genuinely wasn't there.
    #
    # `--with-deps` because a bare Linux container lacks the shared libraries Chromium needs
    # (libnss3, libatk, …), and without them the install succeeds and the launch still fails —
    # the worst of both. Render's build runs as root, so it can install them.
    #
    # Honest cost: this adds roughly 400 MB and a couple of minutes to every build. Worth it for
    # a capability that was advertised in the UI and could not work; not worth it silently, so
    # it's written down here.
    buildCommand: npm ci --include=dev && npx playwright install --with-deps chromium && npm run build
    startCommand: npm start
    autoDeploy: true
    healthCheckPath: /api/health
    disk:
      name: homeops-data
      mountPath: /data
      sizeGB: 1
    envVars:
      # Pin the production Node to the same major CI tests on (.github/workflows/ci.yml
      # uses node-version: 24). Inside package.json engines '>=22.13 <25'; node:sqlite
      # (tenant store, ADR-001) is flag-free from 22.13 / 24 LTS. Without this pin,
      # Render may boot an untested Node major and break the sqlite-backed store.
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: HOMEOPS_ENV
        value: production
      - key: HOMEOPS_DATA_DIR
        value: /data
      # Update these if Render assigns a different service URL or you add a custom domain.
      - key: HOMEOPS_PUBLIC_URL
        value: https://homeops-ai.onrender.com
      - key: HOMEOPS_ALLOWED_ORIGINS
        value: https://homeops-ai.onrender.com
      - key: HOMEOPS_SECRET_KEY
        generateValue: true
      # REQUIRED for elevated sign-in on a public deployment: production refuses
      # Owner / Adult Admin logins until a PIN exists. Set a family PIN here, sign
      # in with it, then optionally change it in Settings (which takes precedence).
      - key: HOMEOPS_BOOTSTRAP_PIN
        sync: false
      # Optional OAuth providers. Fill these in the Render dashboard.
      - key: HOMEOPS_OAUTH_GOOGLE_CLIENT_ID
        sync: false
      - key: HOMEOPS_OAUTH_GOOGLE_CLIENT_SECRET
        sync: false
      - key: HOMEOPS_OAUTH_MICROSOFT_CLIENT_ID
        sync: false
      - key: HOMEOPS_OAUTH_MICROSOFT_CLIENT_SECRET
        sync: false
      - key: HOMEOPS_OAUTH_SLACK_CLIENT_ID
        sync: false
      - key: HOMEOPS_OAUTH_SLACK_CLIENT_SECRET
        sync: false
      - key: HOMEOPS_OAUTH_DROPBOX_CLIENT_ID
        sync: false
      - key: HOMEOPS_OAUTH_DROPBOX_CLIENT_SECRET
        sync: false
      - key: HOMEOPS_OAUTH_NOTION_CLIENT_ID
        sync: false
      - key: HOMEOPS_OAUTH_NOTION_CLIENT_SECRET
        sync: false
      - key: HOMEOPS_OAUTH_TODOIST_CLIENT_ID
        sync: false
      - key: HOMEOPS_OAUTH_TODOIST_CLIENT_SECRET
        sync: false
      - key: HOMEOPS_OAUTH_TICKTICK_CLIENT_ID
        sync: false
      - key: HOMEOPS_OAUTH_TICKTICK_CLIENT_SECRET
        sync: false
