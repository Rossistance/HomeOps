# The token the backend presents to the browser runtime. In a group because Render can
# generate a value ONCE and hand the same one to both services — which is the whole point:
# neither service has the token written down anywhere, and they still agree.
envVarGroups:
  - name: familios-browser-runtime
    envVars:
      - key: BROWSER_RUNTIME_TOKEN
        generateValue: true

services:
  # T4 — "How am I intended to run browser automation with Playwright or something similar
  # from the server? We need to make this be able to work."
  #
  # Like this: as its own service. Chromium cannot live in the backend's container — the two
  # together measured past 512MB on real pages and the OOM killer took the whole app down
  # (2026-07-09), which is why server/browser.mjs refuses to launch below ~900MB and why the
  # connector had been honestly reporting "offline". Out here the browser is the only tenant,
  # and if a heavy page does kill it, it kills a service nothing else depends on.
  #
  # plan: free is deliberate — this costs nothing and spins down when idle. A cold start
  # costs ~50s on the first automation of the day, which is the right trade for something
  # used occasionally and on purpose. Bump to starter if that wait ever grates.
  - type: web
    name: familios-browser-runtime
    runtime: node
    region: oregon
    plan: free
    rootDir: server/browser-runtime
    # --with-deps installs the shared libraries Chromium links against. Without them the
    # download succeeds, the launch fails, and you get "offline" about a browser that is
    # sitting right there on disk — the exact failure this whole item started as.
    buildCommand: npm install && npx playwright install --with-deps chromium
    startCommand: npm start
    autoDeploy: true
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "24"
      # Public URL + a token = the only safe combination. index.mjs binds loopback-only
      # when this is absent, so a missing token can't quietly expose a browser.
      - fromGroup: familios-browser-runtime

  - type: web
    name: homeops-ai
    runtime: node
    region: oregon
    # Persistent disks are not available on Render's Free web-service plan.
    plan: starter
    # --include=dev is required: NODE_ENV=production (set below) also applies at
    # build time on Render, and a bare `npm ci` would omit the devDependencies
    # that the build itself needs (vite, tsc, tailwind).
    # T4 — "how am I intended to run browser automation with Playwright or something similar
    # from the server? We need to make this be able to work."
    #
    # From the server, and it was one line short of working. `postinstall` already downloads
    # Chromium into node_modules (scripts/postinstall-browser.mjs, matching the
    # PLAYWRIGHT_BROWSERS_PATH=0 that server/browser.mjs sets before launching) — but a bare
    # Linux container has none of the shared libraries Chromium links against, so the download
    # succeeded, the launch failed, and browser.mjs stickily marked the runtime unavailable for
    # the life of the process. The connector then honestly reported "runtime offline" about a
    # browser that really was sitting there on disk, unable to start.
    #
    # `install-deps` installs exactly those system packages and nothing else — the browser is
    # already handled, so this deliberately does not re-download it. Render's build runs as
    # root, which is what apt needs. Non-fatal on purpose: if this ever fails, web.read still
    # degrades to plain HTML fetching rather than the deploy falling over.
    buildCommand: npm ci --include=dev && (npx playwright install-deps chromium || echo "[familios] browser deps unavailable — web.read will use plain HTML fetching") && npm run build
    startCommand: npm start
    autoDeploy: true
    healthCheckPath: /api/health
    disk:
      name: homeops-data
      mountPath: /data
      sizeGB: 1
    envVars:
      # Pin the production Node to the same major CI tests on (.github/workflows/ci.yml
      # uses node-version: 24). Inside package.json engines '>=22.13 <25'; node:sqlite
      # (tenant store, ADR-001) is flag-free from 22.13 / 24 LTS. Without this pin,
      # Render may boot an untested Node major and break the sqlite-backed store.
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: HOMEOPS_ENV
        value: production
      - key: HOMEOPS_DATA_DIR
        value: /data
      # T4 — where the browser actually lives. fromService reads the sibling's URL at sync
      # time, so this never goes stale if Render reassigns it, and the shared group means
      # both ends hold the same token without either of them holding it in git.
      - key: BROWSER_RUNTIME_URL
        fromService:
          type: web
          name: familios-browser-runtime
          property: host
      - fromGroup: familios-browser-runtime
      # Update these if Render assigns a different service URL or you add a custom domain.
      - key: HOMEOPS_PUBLIC_URL
        value: https://homeops-ai.onrender.com
      - key: HOMEOPS_ALLOWED_ORIGINS
        value: https://homeops-ai.onrender.com
      - key: HOMEOPS_SECRET_KEY
        generateValue: true
      # REQUIRED for elevated sign-in on a public deployment: production refuses
      # Owner / Adult Admin logins until a PIN exists. Set a family PIN here, sign
      # in with it, then optionally change it in Settings (which takes precedence).
      - key: HOMEOPS_BOOTSTRAP_PIN
        sync: false
      # PLATFORM TRANSACTIONAL EMAIL — password resets, recovery codes, address
      # confirmation. Without this FamiliOS has NO email of its own: the only transport is a
      # household's connected Gmail, which a household one second old does not have, so a
      # family can sign up and then never get back into their account. /api/health reports
      # `mail.readiness` so a missing key is visible rather than discovered by a locked-out
      # customer. FAMILIOS_MAIL_FROM must be a domain verified with the provider — the
      # default sandbox sender only delivers to the provider account's own address.
      - key: RESEND_API_KEY
        sync: false
      - key: FAMILIOS_MAIL_FROM
        sync: false
      # Cross-household operator surface (admin household list, invite minting, and the
      # pre-2026-07-30 all-tenant backup bundles). Deliberately NOT a household role: no
      # value of session.role can express a cross-tenant capability without putting that
      # reach inside a field a household Owner controls. Empty means NOBODY is an operator
      # and those routes 404 — correct for a self-hosted copy. It was set on the service by
      # hand but absent from this blueprint, so a service rebuild would have silently
      # dropped it and taken the operator console with it.
      - key: HOMEOPS_OPERATOR_EMAILS
        sync: false
      # Optional OAuth providers. Fill these in the Render dashboard.
      - key: HOMEOPS_OAUTH_GOOGLE_CLIENT_ID
        sync: false
      - key: HOMEOPS_OAUTH_GOOGLE_CLIENT_SECRET
        sync: false
      - key: HOMEOPS_OAUTH_MICROSOFT_CLIENT_ID
        sync: false
      - key: HOMEOPS_OAUTH_MICROSOFT_CLIENT_SECRET
        sync: false
      - key: HOMEOPS_OAUTH_SLACK_CLIENT_ID
        sync: false
      - key: HOMEOPS_OAUTH_SLACK_CLIENT_SECRET
        sync: false
      - key: HOMEOPS_OAUTH_DROPBOX_CLIENT_ID
        sync: false
      - key: HOMEOPS_OAUTH_DROPBOX_CLIENT_SECRET
        sync: false
      - key: HOMEOPS_OAUTH_NOTION_CLIENT_ID
        sync: false
      - key: HOMEOPS_OAUTH_NOTION_CLIENT_SECRET
        sync: false
      - key: HOMEOPS_OAUTH_TODOIST_CLIENT_ID
        sync: false
      - key: HOMEOPS_OAUTH_TODOIST_CLIENT_SECRET
        sync: false
      - key: HOMEOPS_OAUTH_TICKTICK_CLIENT_ID
        sync: false
      - key: HOMEOPS_OAUTH_TICKTICK_CLIENT_SECRET
        sync: false
