# ============================================================
# HomeOps AI — Netlify frontend deployment config
# Copy this file to the REPO ROOT before deploying.
# ============================================================
[build]
  command   = "npm run build"
  publish   = "dist"

[build.environment]
  # Point the frontend at your hosted backend.
  # Deploy the backend first (see render.yaml), then paste its URL here.
  HOMEOPS_BACKEND = "https://your-homeops-backend.onrender.com"

# SPA redirect — serve index.html for all routes.
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options           = "DENY"
    X-Content-Type-Options    = "nosniff"
    Referrer-Policy           = "strict-origin-when-cross-origin"
    Permissions-Policy        = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy   = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https:; font-src 'self';"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
